<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports Generation</title>
  <style>
    :root{
      --bg: #2f3b2f;
      --panel: #556634;
      --panelAlt: #3b4a36;
      --card: #2f3f34;
      --stroke: rgba(255,255,255,.14);
      --text: #e9efd6;
      --muted: rgba(233,239,214,.72);
      --btn: #cbbd7c;
      --btnText: #223017;
      --btnDark: #2e3b32;
      --green: #23b35a;
      --amber: #d6a64f;
      --blue: #2d6ef7;
      --red: #d94a3a;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: radial-gradient(1200px 700px at 20% -10%, rgba(255,255,255,.06), transparent 55%),
                  radial-gradient(900px 600px at 85% 30%, rgba(0,0,0,.22), transparent 55%),
                  var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .wrap{ max-width: 1180px; margin: 22px auto 40px; padding: 0 18px; }

    /* header */
    .topbar{
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 18px 18px;
      box-shadow: 0 12px 26px rgba(0,0,0,.25);
    }
    .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; gap: 16px; }
    .title h1{ margin:0; font-size: 28px; font-weight: 900; letter-spacing:.2px; }
    .title p{ margin:6px 0 0; color: var(--muted); font-size: 14px; font-weight: 700; }
    .top-actions{ display:flex; align-items:center; gap: 12px; margin-top: 4px; }
    .btn{ border:1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 10px 16px; font-weight: 900; cursor:pointer; background: rgba(0,0,0,.20); color: var(--text); box-shadow: 0 8px 18px rgba(0,0,0,.22); }
    .btn.light{ background: var(--btn); color: var(--btnText); border-color: rgba(0,0,0,.25); }
    .btn.dark{ background: var(--btnDark); color: rgba(233,239,214,.88); }
    .home-btn{ width:38px; height:38px; background:#3a4638; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; }
    .home-btn:hover{ background:#4a5648; }

    /* layout */
    .grid{ margin-top: 18px; display:grid; grid-template-columns: 1.05fr .95fr; gap: 16px; }
    .panel{ background: var(--panel); border: 1px solid var(--stroke); border-radius: 12px; padding: 14px; box-shadow: 0 12px 22px rgba(0,0,0,.22); }
    .panel-title{ display:flex; align-items:center; gap: 10px; font-weight:900; letter-spacing:.15px; margin-bottom: 14px; }
    .panel-title .mini{ width: 32px; height:32px; border-radius:10px; display:grid; place-items:center; background: rgba(0,0,0,.16); border:1px solid rgba(255,255,255,.10); }

    /* form */
    .section{ margin-bottom: 16px; }
    .section h4{ margin:0 0 8px; font-size: 14px; color: var(--muted); font-weight:900; }
    .input-row{ display:flex; align-items:center; gap:10px; }
    .input{ flex:1; display:flex; align-items:center; gap:10px; background: rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.14); border-radius: 10px; height: 46px; padding: 0 12px; box-shadow: inset 0 6px 12px rgba(0,0,0,.18); }
    .input input{ flex:1; background: transparent; border:0; outline:0; color: var(--text); font-weight: 900; letter-spacing:.2px; }
    .input .icon{ width:22px; height:22px; opacity:.85; }
    /* date-field: position calendar icon inside input and hide native indicator */
    .date-field{ position:relative; }
    .date-field input[type="date"]{ padding-right:44px; }
    .date-field input[type="date"]::-webkit-calendar-picker-indicator{ display:none; -webkit-appearance:none; }
    .date-field .calendar-icon{ position:absolute; right:12px; top:50%; transform:translateY(-50%); width:22px; height:22px; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; }
    .field-label{ margin: 6px 2px 6px; color: var(--muted); font-weight: 900; }

    .checks{ display:flex; flex-direction:column; gap:8px; }
    .checks label{ display:flex; align-items:center; gap:10px; font-weight:900; }
    .checks input{ width:18px; height:18px; accent-color: var(--amber); }
    .checks input:focus{ outline: 2px solid rgba(230, 213, 180, 0.45); outline-offset:2px; }

    .actions{ display:flex; flex-direction:column; gap:12px; margin-top: 14px; }
    .action-btn{ height:52px; border-radius:10px; border:1px solid rgba(255,255,255,.14); cursor:pointer; box-shadow:0 10px 18px rgba(0,0,0,.18); font-weight:900; }
    .action-btn.primary{ background: var(--btnDark); color: rgba(233,239,214,.88); }
    .action-btn.secondary{ background: #0f120f; color: var(--text); border-color: rgba(255,255,255,.20); }

    /* preview */
    .preview-box{ background: rgba(0,0,0,.12); border:1px solid rgba(255,255,255,.12); border-radius:10px; min-height: 220px; box-shadow: inset 0 10px 14px rgba(0,0,0,.18); padding: 12px; overflow:auto; }
    .preview-box .hint{ color: rgba(233,239,214,.80); font-weight:900; display:grid; place-items:center; min-height:200px; }
    .preview-card{ background: #f5f6f4; color:#223017; border:1px solid rgba(0,0,0,.18); border-radius:10px; padding: 16px; box-shadow:0 8px 16px rgba(0,0,0,.20); }
    .report-title{ text-align:center; font-weight:900; letter-spacing:.2px; }
    .report-sub{ text-align:center; color:#4a4f42; font-weight:700; margin-top:4px; }
    .summary{ margin: 14px 0; display:flex; gap: 14px; justify-content:flex-start; }
    .badge{ flex:0 0 150px; height:56px; border-radius:8px; display:grid; place-items:center; font-weight:900; color:#f7f7f7; }
    .badge.total{ background:#3b463b; }
    .badge.present{ background:#23b35a; }
    .badge.leave{ background:#d6a64f; }
    .badge.awol{ background:#d94a3a; }
    .badge.duty{ background:#2d6ef7; }
    .badge .small{ display:block; font-size:12px; opacity:.92; }
    .report-table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid rgba(0,0,0,.18); }
    .report-table thead th{ background:#6b774f; color:#fff; padding:10px; text-align:left; border-bottom:2px solid rgba(0,0,0,.18); font-weight:900; }
    .report-table tbody td{ padding:10px; border-bottom:1px solid rgba(0,0,0,.12); font-weight:700; color:#333; }
    .pill{ display:inline-flex; align-items:center; justify-content:center; height:26px; padding:0 10px; border-radius:6px; font-weight:900; color:#fff; }
    .pill.green{ background:#23b35a; }
    .pill.amber{ background:#d6a64f; }
    .pill.blue{ background:#2d6ef7; }
    .pill.red{ background:#d94a3a; }

    /* footer */
    .footer{ margin-top: 16px; display:flex; justify-content:flex-end; }
    .back{ border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:10px 16px; background: rgba(0,0,0,.20); color: var(--text); font-weight:900; cursor:pointer; }

    /* Print styles - only show preview card */
    @media print {
      body {
        background: white !important;
        margin: 0;
        padding: 0;
      }
      .wrap {
        max-width: 100%;
        margin: 0;
        padding: 0;
      }
      .topbar,
      .grid > .panel:first-child,
      .panel-title,
      .footer {
        display: none !important;
      }
      .grid {
        display: block !important;
        margin: 0;
      }
      .panel {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .preview-box {
        background: none !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .preview-card {
        box-shadow: none !important;
        border: 1px solid #ddd !important;
        margin: 0;
        padding: 20px;
      }
    }

    @media (max-width: 1100px){ .grid{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="topbar-row">
        <div class="title">
          <h1>Reports Generation</h1>
          <p>Generate and Export Parade State Reports</p>
        </div>
        <div class="top-actions">
          <button class="btn light" onclick="location.href='adjt_dashboard.html'">Home</button>
          <button class="btn dark" onclick="location.href='../../login.html'">Logout</button>
        </div>
      </div>
    </header>

    <section class="grid">
      <!-- Left: Configuration -->
      <div class="panel">
        <div class="panel-title">
          <div class="mini" aria-hidden="true">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="4" width="18" height="16" rx="2" stroke="rgba(233,239,214,.9)" stroke-width="2"/>
            </svg>
          </div>
          <span>Report Configuration</span>
        </div>

        <div class="section">
          <h4>Date Range</h4>
          <div class="section">
            <div class="field-label">Start Date</div>
            <div class="input-row">
              <div class="input date-field" title="Start Date">
                <svg class="icon" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="4" width="18" height="16" rx="2" stroke="rgba(233,239,214,.9)" stroke-width="2"/>
                </svg>
                <input id="startDate" type="date" value="2025-01-01" aria-label="Start Date" />
                <div class="calendar-icon" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none">
                    <path d="M7 10h10M7 14h7" stroke="rgba(233,239,214,.9)" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>
          <div class="section">
            <div class="field-label">End Date</div>
            <div class="input-row">
              <div class="input date-field" title="End Date">
                <svg class="icon" viewBox="0 0 24 24" fill="none">
                  <rect x="3" y="4" width="18" height="16" rx="2" stroke="rgba(233,239,214,.9)" stroke-width="2"/>
                </svg>
                <input id="endDate" type="date" value="2025-01-02" aria-label="End Date" />
                <div class="calendar-icon" aria-hidden="true">
                  <svg class="icon" viewBox="0 0 24 24" fill="none">
                    <path d="M7 10h10M7 14h7" stroke="rgba(233,239,214,.9)" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h4>Company Filter</h4>
          <div class="section">
            <div class="field-label">Select Company</div>
            <div class="input-row">
              <select id="companyFilter" class="input" aria-label="Company Filter">
                <option value="all">All Companies</option>
                <!-- Companies will be populated dynamically -->
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <h4>Include Column</h4>
          <div class="checks">
            <label><input id="colName" type="checkbox" checked /> Name</label>
            <label><input id="colRank" type="checkbox" checked /> Rank</label>
            <label><input id="colCompany" type="checkbox" checked /> Company</label>
            <label><input id="colStatus" type="checkbox" checked /> Status</label>
            <label><input id="colRemark" type="checkbox" checked /> Remark</label>
          </div>
        </div>

        <div class="actions">
          <button id="btnPreview" class="action-btn primary">Generate Preview</button>
          <button id="btnPrint" class="action-btn secondary">Print Report</button>
        </div>
      </div>

      <!-- Right: Preview -->
      <div class="panel">
        <div class="panel-title">
          <div class="mini" aria-hidden="true">
            <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M7 6h10v12H7z" stroke="rgba(233,239,214,.9)" stroke-width="2"/>
            </svg>
          </div>
          <span>Report Preview</span>
        </div>
        <div id="preview" class="preview-box">
          <div class="hint">Configure report settings and click Generate Preview</div>
        </div>
        <div class="footer">
          <button class="back" onclick="location.href='adjt_dashboard.html'">Back</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000';
    const preview = document.getElementById('preview');
    const btnPreview = document.getElementById('btnPreview');
    const btnPrint = document.getElementById('btnPrint');
    const fmt = (iso) => {
      if(!iso) return '';
      const [y,m,d] = iso.split('-');
      return `${d}/${m}/${y}`;
    };

    let soldiersData = []; // Will hold fetched soldier data
    let dataLoaded = false; // Flag to track if data loaded successfully

    // Fetch soldiers data on page load
    async function fetchSoldiersData() {
      try {
        const token = localStorage.getItem('token');
        if (!token) {
          alert('You are not logged in. Redirecting to login page.');
          window.location.href = '../../login.html';
          return;
        }

        // Fetch soldiers
        const userResponse = await fetch(`${API_BASE}/api/users`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!userResponse.ok) {
          console.error('Failed to fetch users:', userResponse.status);
          alert(`Failed to load soldier data. Status: ${userResponse.status}. Please check your connection and permissions.`);
          soldiersData = []; // Ensure it's empty
          dataLoaded = false;
          buildPreview(); // Show error state
          return;
        }

        const userData = await userResponse.json();
        soldiersData = userData.users.filter(user => user.role === 'soldier');

        // Fetch leaves
        const leaveResponse = await fetch(`${API_BASE}/api/leaves`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        let allLeaves = [];
        if (leaveResponse.ok) {
          const leaveData = await leaveResponse.json();
          allLeaves = leaveData.leaves;
        } else {
          console.error('Failed to fetch leaves:', leaveResponse.status);
        }

        // Process soldier data with current status
        const now = new Date();
        const today = now.toISOString().split('T')[0];

        soldiersData = soldiersData.map(soldier => {
          // Check attendance for today
          const attendanceKey = `attendance_${soldier.service_number}_${today}`;
          const attendance = JSON.parse(localStorage.getItem(attendanceKey) || '{}');
          const special = attendance['special_status'];

          let status = 'Present';
          let remark = '';

          if (special === 'AWOL') {
            status = 'AWOL';
            remark = attendance.notes || 'Not Reported';
          } else if (special === 'Leave') {
            status = 'Leave';
            remark = attendance.notes || 'Leave';
          } else if (special === 'on_duty') {
            status = 'On Duty';
            remark = attendance.notes || 'Duty';
          } else {
            // Check if on approved leave
            const activeLeave = allLeaves.find(leave => {
              const start = new Date(leave.start_date);
              const end = new Date(leave.end_date);
              return (leave.user_id._id || leave.user_id) === soldier._id &&
                     now >= start && now <= end && leave.status === 'approved';
            });
            if (activeLeave) {
              status = 'Leave';
              remark = activeLeave.reason || 'Approved Leave';
            }
          }

          return {
            id: soldier.service_number,
            rank: soldier.rank,
            name: soldier.name,
            company: soldier.company,
            status: status,
            remark: remark
          };
        });

        // Populate company filter immediately after data is loaded
        populateCompanyFilter();

        // Mark data as loaded
        dataLoaded = true;

        // Build initial preview
        buildPreview();

      } catch (error) {
        console.error('Error fetching soldiers data:', error);
        alert('Error loading soldier data. Please check your connection.');
        soldiersData = [];
        dataLoaded = false;
        buildPreview();
      }
    }

    // Function to populate company filter dropdown
    function populateCompanyFilter() {
      const companyFilter = document.getElementById('companyFilter');
      const companies = [...new Set(soldiersData.map(s => s.company).filter(c => c))].sort();
      companyFilter.innerHTML = '<option value="all">All Companies</option>';
      companies.forEach(company => {
        const option = document.createElement('option');
        option.value = company;
        option.textContent = company;
        companyFilter.appendChild(option);
      });
    }

    const statusPill = (s) => {
      const map = {
        'Present': 'green',
        'Leave': 'amber',
        'AWOL': 'red',
        'On Duty': 'blue'
      };
      const cls = map[s] || 'green';
      return `<span class="pill ${cls}">${s}</span>`;
    };

    function buildPreview(){
      if (!dataLoaded) {
        preview.innerHTML = '<div class="hint">Loading soldier data...</div>';
        return;
      }

      if (soldiersData.length === 0) {
        preview.innerHTML = '<div class="hint">No soldier data available. Please check your connection and try again.</div>';
        return;
      }

      const startIso = (document.getElementById('startDate').value || '').trim();
      const endIso = (document.getElementById('endDate').value || '').trim();
      const start = fmt(startIso); const end = fmt(endIso);

      const selectedCompany = document.getElementById('companyFilter').value;

      // Filter soldiers by company if selected
      let filteredSoldiers = soldiersData;
      if (selectedCompany !== 'all') {
        filteredSoldiers = soldiersData.filter(s => s.company === selectedCompany);
      }

      const include = {
        rank: document.getElementById('colRank').checked,
        name: document.getElementById('colName').checked,
        company: document.getElementById('colCompany').checked,
        status: document.getElementById('colStatus').checked,
        remark: document.getElementById('colRemark').checked,
      };

      const counts = filteredSoldiers.reduce((acc, r)=>{
        acc.total++; 
        if(r.status==='Present') acc.present++; 
        if(r.status==='Leave') acc.leave++; 
        if(r.status==='AWOL') acc.awol++; 
        if(r.status==='On Duty') acc.onDuty++;
        return acc;
      }, { total:0, present:0, leave:0, awol:0, onDuty:0 });

      const headers = ['ID'];
      if(include.rank) headers.push('Rank');
      if(include.name) headers.push('Name');
      if(include.company) headers.push('Company');
      if(include.status) headers.push('Status');
      if(include.remark) headers.push('Remarks');

      const rowsHtml = filteredSoldiers.map(r=>{
        const cells = [r.id];
        if(include.rank) cells.push(r.rank);
        if(include.name) cells.push(r.name);
        if(include.company) cells.push(r.company);
        if(include.status) cells.push(statusPill(r.status));
        if(include.remark) cells.push(r.remark);
        return `<tr>${cells.map((c,i)=>`<td>${c || ''}</td>`).join('')}</tr>`;
      }).join('');

      const html = `
        <div class="preview-card">
          <div class="report-title">PARADE STATE REPORT</div>
          <div class="report-sub">Report Period: ${startIso || endIso ? `${start} to ${end}` : 'Current Status'}${selectedCompany !== 'all' ? ` | Company: ${selectedCompany}` : ''}</div>
          <div class="summary">
            <div class="badge total"><div><span style="font-size:20px">${counts.total}</span><span class="small">Total</span></div></div>
            <div class="badge present"><div><span style="font-size:20px">${counts.present}</span><span class="small">Present</span></div></div>
            <div class="badge leave"><div><span style="font-size:20px">${counts.leave}</span><span class="small">Leave</span></div></div>
            <div class="badge awol"><div><span style="font-size:20px">${counts.awol}</span><span class="small">AWOL</span></div></div>
            <div class="badge duty"><div><span style="font-size:20px">${counts.onDuty}</span><span class="small">On Duty</span></div></div>
          </div>
          <table class="report-table">
            <thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>`;

      preview.innerHTML = html;
    }

    // allow manual preview generation
    let previewShown = false;
    btnPreview.addEventListener('click', async ()=>{ 
      await fetchSoldiersData();
      previewShown = true; 
      buildPreview(); 
    });

    // Load data on page load to populate company filter
    window.addEventListener('DOMContentLoaded', async () => {
      await fetchSoldiersData();
    });

    // debounce helper
    function debounce(fn, wait){ let t; return function(...args){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,args), wait); }; }

    const debouncedBuild = debounce(()=>{ if(previewShown) buildPreview(); }, 250);

    // dynamic update: when filters change, update preview automatically (after initial Generate)
    ['startDate','endDate','companyFilter','colName','colRank','colCompany','colStatus','colRemark'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('change', debouncedBuild);
    });

    btnPrint.addEventListener('click', () => {
      window.print();
    });

    // make calendar icon open/focus the native picker where supported (matches lve_mgt behavior)
    document.querySelectorAll('.date-field').forEach(df=>{
      const input = df.querySelector('input[type="date"]');
      const icon = df.querySelector('.calendar-icon');
      if(!input || !icon) return;
      icon.addEventListener('click', ()=>{
        if(typeof input.showPicker === 'function'){
          input.showPicker();
        } else {
          input.focus();
          try{ input.click(); }catch(e){}
        }
      });
    });
  </script>
</body>
</html>
