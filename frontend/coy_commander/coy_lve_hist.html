<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Leave History</title>

<style>
/* ===== RESET & FULL HEIGHT FIX ===== */
html, body{
    margin:0;
    padding:0;
    height:100%;
}

body{
    background:#2f3a32;     /* correct dark green background */
    font-family:Segoe UI, Arial, sans-serif;
    color:#ffffff;
}

/* ===== HEADER ===== */
.header{
    background:#6b7740;
    padding:22px 32px;
    border-bottom:2px solid #8f9960;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    margin:6px 0 0;
    font-size:14px;
    color:#dde2b5;
}

.header-right{
    display:flex;
    align-items:center;
    gap:14px;
}

.home-btn{
    width:38px;
    height:38px;
    background:#3a4638;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:20px;
}
.home-btn:hover{
    background:#4a5648;
}

.logout{
    padding:8px 18px;
    background:#3a4638;
    border:1px solid #8f9960;
    color:white;
    border-radius:6px;
}

/* project button styles (shared) */
.btn{ border:1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 8px 12px; font-weight: 700; cursor:pointer; background: transparent; color: #ffffff; }
.btn.light{ background: #c9c295; color: #2f2f1f; border-color: rgba(0,0,0,.12); }
.btn.dark{ background: #3a4638; color: #ffffff; border-color: rgba(255,255,255,.08); }

/* ===== MAIN AREA ===== */
.main{
    padding:26px;
}

/* ===== PANEL ===== */
.panel{
    max-width:1150px;
    margin:0 auto;
    background:#6f7f46;
    border-radius:10px;
    padding:26px;
    border:1px solid #8f9960;
}

/* ===== TABS ===== */
.tabs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:22px;
    margin-bottom:28px;
}

.tab{
    padding:16px 0;
    text-align:center;
    border-radius:10px;
    font-weight:600;
    background:#c9c295;
    color:#2f2f1f;
}

.tab.active{
    background:#2f3b32;
    color:#dde2b5;
}

/* ===== TABLE ===== */
table{
    width:100%;
    border-collapse:collapse;
}

thead th{
    text-align:left;
    padding:14px 12px;
    font-size:15px;
    color:#dde2b5;
    border-bottom:2px solid #8f9960;
}

tbody td{
    padding:18px 12px;
    font-size:16px;
}

tbody tr:not(:last-child){
    border-bottom:1px solid #7f8a52;
}

/* ===== STATUS ===== */
.status{
    padding:6px 18px;
    border-radius:16px;
    font-weight:600;
    display:inline-block;
    min-width:100px;
    text-align:center;
}

.pending{ background:#b08a2e; }
.approved{ background:#5aa23f; }
.rejected{ background:#c2332a; }

/* ===== BACK BUTTON (INSIDE MAIN ONLY) ===== */
.back-wrapper{
    max-width:1150px;
    margin:14px auto 0;
    display:flex;
    justify-content:flex-end;
}

.back{
    padding:10px 22px;
    background:#c9c295;
    color:#2f2f1f;
    border-radius:6px;
    font-weight:600;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div>
        <h1>Leave Management System</h1>
        <p>Submit and Track Leave Requests</p>
    </div>
    <div class="header-right">
        <button class="btn light" onclick="location.href='coy_dashboard.html'">Home</button>
        <button class="btn dark" onclick="location.href='../../login.html'">Logout</button>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <div class="panel">

        <!-- TABS -->
        <div class="tabs">
            <a class="tab" href="Leave_approval.html">Leave Approval</a>
            <a class="tab active" href="coy_lve_hist.html">Leave History</a>
        </div>

        <div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <select id="statusFilter" onchange="loadHistory()" style="padding:8px 12px;background:#2f3b32;border:1px solid #8f9960;color:#e6e6c6;border-radius:6px;font-size:14px;">
                <option value="">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
            <button onclick="clearHistory()" style="padding:8px 18px;background:#c2342a;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px;">Clear All History</button>
        </div>

        <!-- TABLE -->
        <table>
            <thead>
                <tr>
                    <th>Soldier</th>
                    <th>Rank</th>
                    <th>Company</th>
                    <th>Leave Type</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="historyTable">
            </tbody>
        </table>

    </div>

</div>

<script>
const API_BASE = 'http://localhost:5000';
// Session helper: sessionStorage per tab, localStorage as fallback
const _ss = k => sessionStorage.getItem(k) || localStorage.getItem(k);

// Verify coy_comd role
(function checkRole() {
    const user = JSON.parse(_ss('user') || '{}');
    if (user.role !== 'coy_comd') {
        alert('You must be logged in as Company Commander.');
        window.location.href = '../../login.html';
    }
})();

async function loadHistory() {
    const token = _ss('token');
    if (!token) return;

    const tbody = document.getElementById('historyTable');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#dde2b5;">Loading...</td></tr>';

    const statusFilter = document.getElementById('statusFilter').value;
    const url = statusFilter
        ? `${API_BASE}/api/leaves?status=${statusFilter}`
        : `${API_BASE}/api/leaves`;

    try {
        const response = await fetch(url, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        const leaves = data.leaves || [];

        tbody.innerHTML = '';

        if (leaves.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#dde2b5;">No leave records found</td></tr>';
            return;
        }

        leaves.forEach(req => {
            const startDate = new Date(req.start_date).toLocaleDateString('en-GB');
            const endDate = new Date(req.end_date).toLocaleDateString('en-GB');
            const statusClass = req.status.toLowerCase();
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${req.rank || ''} ${req.name}</td>
                <td>${req.rank || 'N/A'}</td>
                <td>${req.company || 'N/A'}</td>
                <td>${req.type_name}</td>
                <td>${startDate} - ${endDate}</td>
                <td><span class="status ${statusClass}">${req.status.charAt(0).toUpperCase() + req.status.slice(1)}</span></td>
            `;
            tbody.appendChild(row);
        });
    } catch (err) {
        console.error('History load error:', err);
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:#ff6b6b;">Connection error</td></tr>';
    }
}

async function clearHistory() {
    if (!confirm('Are you sure you want to delete ALL leave records? This cannot be undone.')) return;
    const token = _ss('token');
    if (!token) return;
    try {
        const response = await fetch(`${API_BASE}/api/leaves`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        if (response.ok) {
            alert(data.message);
            loadHistory();
        } else {
            alert(data.error || 'Failed to clear history');
        }
    } catch (err) {
        console.error('Clear history error:', err);
        alert('Connection error.');
    }
}

// Load history on page load
loadHistory();
</script>

</body>
</html>
