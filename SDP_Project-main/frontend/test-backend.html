<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>ParadeOps Backend Connection Test</h1>
    
    <div id="results"></div>
    
    <script>
        const API_URL = 'http://localhost:5000';
        const resultsDiv = document.getElementById('results');
        
        async function test() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                addResult('✓ Backend Health Check', true, JSON.stringify(data, null, 2));
            } catch (err) {
                addResult('✗ Backend Health Check', false, err.message);
            }
        }
        
        function addResult(name, success, details) {
            const div = document.createElement('div');
            div.className = `test ${success ? 'pass' : 'fail'}`;
            div.innerHTML = `<strong>${name}</strong><br><pre>${details}</pre>`;
            resultsDiv.appendChild(div);
        }
        
        // Run test after 1 second
        setTimeout(test, 1000);
    </script>
</body>
</html>
