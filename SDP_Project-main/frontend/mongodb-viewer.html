<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoDB Data Viewer - ParadeOps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .collections {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 20px;
        }
        .collection-card {
            flex: 1;
            min-width: 300px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .collection-card:hover {
            transform: translateY(-5px);
        }
        .collection-title {
            font-size: 1.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .document {
            background: white;
            border: 1px solid #e9ecef;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .document-number {
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
        }
        .no-data {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 20px;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease;
        }
        .refresh-btn:hover {
            background: #2980b9;
        }
        .stats {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .stats strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 MongoDB Data Viewer</h1>
            <p>ParadeOps Database Collections</p>
        </div>

        <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>

        <div class="collections" id="collectionsContainer">
            <div class="collection-card">
                <div class="collection-title">Loading...</div>
                <div class="no-data">Please wait while we fetch data...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            const container = document.getElementById('collectionsContainer');
            container.innerHTML = '<div class="collection-card"><div class="collection-title">Loading...</div><div class="no-data">Fetching data from MongoDB...</div></div>';

            try {
                // Fetch data from our API
                const [usersRes, leavesRes, equipmentRes, leaveTypesRes] = await Promise.all([
                    fetch('http://localhost:5000/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ service_number: 'BA-12170', password: 'password123' })
                    }),
                    fetch('http://localhost:5000/api/leaves'),
                    fetch('http://localhost:5000/api/equipment'),
                    fetch('http://localhost:5000/api/leaves/types')
                ]);

                const usersData = await usersRes.json();
                const leavesData = await leavesRes.json();
                const equipmentData = await equipmentRes.json();
                const leaveTypesData = await leaveTypesRes.json();

                // Get token for authenticated requests
                const token = usersData.token;

                // Fetch authenticated data
                const [leavesAuthRes, equipmentAuthRes] = await Promise.all([
                    fetch('http://localhost:5000/api/leaves', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch('http://localhost:5000/api/equipment', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);

                const leaves = await leavesAuthRes.json();
                const equipment = await equipmentAuthRes.json();

                displayCollections({
                    users: [usersData.user], // Current user only
                    leaves: leaves.leaves || [],
                    equipment: equipment.equipment || [],
                    leavetypes: leaveTypesData || []
                });

            } catch (error) {
                container.innerHTML = `<div class="collection-card"><div class="collection-title">Error</div><div class="no-data">Failed to load data: ${error.message}</div></div>`;
            }
        }

        function displayCollections(data) {
            const container = document.getElementById('collectionsContainer');
            container.innerHTML = '';

            Object.entries(data).forEach(([collectionName, documents]) => {
                const card = document.createElement('div');
                card.className = 'collection-card';

                card.innerHTML = `
                    <div class="collection-title">${collectionName.toUpperCase()}</div>
                    <div class="stats">
                        <strong>${documents.length}</strong> documents found
                    </div>
                `;

                if (documents.length === 0) {
                    card.innerHTML += '<div class="no-data">(No documents found)</div>';
                } else {
                    documents.forEach((doc, index) => {
                        const docDiv = document.createElement('div');
                        docDiv.className = 'document';
                        docDiv.innerHTML = `
                            <div class="document-number">Document ${index + 1}:</div>
                            ${JSON.stringify(doc, null, 2)}
                        `;
                        card.appendChild(docDiv);
                    });
                }

                container.appendChild(card);
            });
        }

        // Load data on page load
        loadData();

        // Auto refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
